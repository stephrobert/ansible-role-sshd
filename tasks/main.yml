---
- name: Include variables
  ansible.builtin.include_vars: "{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}-var.yml"
- name: Merge Config
  ansible.builtin.set_fact:
    sshd_config: >-
      {{ _sshd_config | combine(distribution_sshd_config, sshd_config) }}
- name: Deploy Config
  become: true
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    mode: 0600
    backup: true
    validate: sshd -t -f %s
  notify: Restart SSHD