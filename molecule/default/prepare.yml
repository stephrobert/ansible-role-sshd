---
- name: Install Tools
  hosts: all
  gather_facts: true
  tasks:
    - name: Install Tools
      become: true
      ansible.builtin.package:
        name:
          - python3-pip
          - htop
          - net-tools
    - name: Install ssh-audit
      ansible.builtin.pip:
        name: ssh-audit
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: 1

    - name: add {{ extra_path }} to path
      vars:
        extra_path: $HOME/.local/bin
      become: true
      ansible.builtin.lineinfile:
        dest: /etc/environment
        state: present
        backrefs: yes
        regexp: 'PATH=(["]*)((?!.*?{{ extra_path }}).*?)(["]*)$'
        line: "PATH=\\1\\2:{{ extra_path }}\\3"
