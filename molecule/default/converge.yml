---
- name: Converge
  hosts: all
  vars:
    sshd_config:
      PermitRootLogin: no
    content_version: 0.1.74
    install_content: true
    install_oscap: true
    oscap_version: 1.4.0
    reports_folder: /opt/openscap-reports
    scan: true
  pre_tasks:
    - name: Include role
      ansible.builtin.include_role:
        name: ansible-role-sshd
  roles:
    - stephrobert.openscap