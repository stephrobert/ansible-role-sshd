---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: ubuntu-sshd
    image: ubuntu_ansible
    memory: 2048
    cpus: 3
    ssh_user: ansible
  - name: debian-sshd
    image: debian_ansible
    memory: 4096
    cpus: 3
    ssh_user: ansible
provisioner:
  name: ansible
verifier:
  name: ansible
